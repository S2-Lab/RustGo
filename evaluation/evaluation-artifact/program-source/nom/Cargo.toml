[package]

name = "nom"
version = "7.0.0"
authors = [ "contact@geoffroycouprie.com" ]
description = "A byte-oriented, zero-copy, parser combinators library"
license = "MIT"
repository = "https://github.com/Geal/nom"
readme = "README.md"
documentation = "https://docs.rs/nom"
keywords = ["parser", "parser-combinators", "parsing", "streaming", "bit"]
categories = ["parsing"]
edition = "2018"
autoexamples = false

include = [
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
  ".gitignore",
  "Cargo.toml",
  "src/*.rs",
  "src/*/*.rs",
  "tests/*.rs",
  "doc/nom_recipes.md",
  "build.rs"
]

[features]
alloc = []
std = ["alloc", "memchr/std", "minimal-lexical/std"]
default = ["std"]
docsrs = []

[dependencies.minimal-lexical]
version = "0.2.0"
default-features = false

#[dependencies.memchr]
#version = "2.3"
#default-features = false

[dev-dependencies]
criterion = "0.3"
jemallocator = "^0.3"
doc-comment = "0.3"
proptest = "1.0.0"

[dependencies]
smallvec = "0.6.6" #2019_0009
string-interner = "0.7.0" #2019_0023
http="=0.1.19" #2019_0034
cbox ="=0.3.0" #2020_0005
simple-slab = "=0.3.2" #2020_0039
qwutils = "=0.3.0" #2021_0018
toodee = "0.2.0" #2021_0028
nano_arena = "=0.5.0" #2021_0031
stack_dst = "=0.6.0" #2021_0033
endian_trait = "=0.6.0" #2021_0039
insert_many = "0.1.1" #2021_0042
stackvector = "=1.1.1" #2021_0048
through = { git = "https://github.com/gretchenfrage/through"} #2021_0049
algorithmica = "=0.1.8" #2021_0053
secp256k1 = "=0.22.0" #2022_0070
byteorder = "=1.4.3" #handling
libc = "=0.2.126" #handling
once_cell = "=1.10.0"
cc = "=1.0.72"
memchr = "=2.5.0"
lazy_static = "1.4.0" 


[build-dependencies]
version_check = "0.9"

[package.metadata.docs.rs]
features = ["alloc", "std", "docsrs"]
all-features = true

[profile.bench]
debug = true
lto = true
codegen-units = 1

[lib]
bench = false

[[test]]
name = "arithmetic"

[[test]]
name = "arithmetic_ast"
required-features = ["alloc"]

[[test]]
name = "blockbuf-arithmetic"

[[test]]
name = "css"

[[test]]
name = "custom_errors"

[[test]]
name = "float"

[[test]]
name = "ini"
required-features = ["alloc"]

[[test]]
name = "ini_str"
required-features = ["alloc"]

[[test]]
name = "issues"
required-features = ["alloc"]

[[test]]
name = "json"

[[test]]
name = "mp4"
required-features = ["alloc"]

[[test]]
name = "multiline"
required-features = ["alloc"]

[[test]]
name = "overflow"

[[test]]
name = "reborrow_fold"

[[test]]
name = "fnmut"
required-features = ["alloc"]

[[bench]]
name = "arithmetic"
path = "benches/arithmetic.rs"
harness = false

[[bench]]
name = "number"
path = "benches/number.rs"
harness = false

[[bench]]
name = "http"
path = "benches/http.rs"
harness = false

[[bench]]
name = "ini"
path = "benches/ini.rs"
harness = false

[[bench]]
name = "ini_str"
path = "benches/ini_str.rs"
harness = false

[[bench]]
name = "json"
path = "benches/json.rs"
harness = false

[[example]]
name = "json"
required-features = ["alloc"]
path = "examples/json.rs"

[[example]]
name = "iterator"

[[example]]
name = "s_expression"
path = "examples/s_expression.rs"
required-features = ["alloc"]

[[example]]
name = "string"
required-features = ["alloc"]
path = "examples/string.rs"

[badges]
travis-ci = { repository = "Geal/nom" }
coveralls = { repository = "Geal/nom", branch = "master", service = "github" }
maintenance = { status = "actively-developed" }

[[bin]]
name = "fuzz-target"
path = "src/fuzz-target.rs"
test = false
doc = false