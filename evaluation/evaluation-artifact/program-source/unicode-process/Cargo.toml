[package]

name = "unicode-normalization"
version = "0.1.24"
authors = [
    "kwantam <kwantam@gmail.com>",
    "Manish Goregaokar <manishsmail@gmail.com>",
]

homepage = "https://github.com/unicode-rs/unicode-normalization"
repository = "https://github.com/unicode-rs/unicode-normalization"
documentation = "https://docs.rs/unicode-normalization/"

license = "MIT OR Apache-2.0"
keywords = [
    "text",
    "unicode",
    "normalization",
    "decomposition",
    "recomposition",
]
readme = "README.md"
description = """
This crate provides functions for normalization of
Unicode strings, including Canonical and Compatible
Decomposition and Recomposition, as described in
Unicode Standard Annex #15.
"""

rust-version = "1.36"

edition = "2018"

exclude = ["target/*", "Cargo.lock", "scripts/tmp", "*.txt", "tests/*"]

[dependencies]
smallvec = "0.6.6" #2019_0009
string-interner = "0.7.0" #2019_0023
http="=0.1.19" #2019_0034
cbox ="=0.3.0" #2020_0005
simple-slab = "=0.3.2" #2020_0039
qwutils = "=0.3.0" #2021_0018
toodee = "0.2.0" #2021_0028
nano_arena = "=0.5.0" #2021_0031
stack_dst = "=0.6.0" #2021_0033
endian_trait = "=0.6.0" #2021_0039
insert_many = "0.1.1" #2021_0042
stackvector = "=1.1.1" #2021_0048
through = { git = "https://github.com/gretchenfrage/through"} #2021_0049
algorithmica = "=0.1.8" #2021_0053
secp256k1 = "=0.22.0" #2022_0070
byteorder = "=1.4.3" #handling
libc = "=0.2.126" #handling
once_cell = "=1.10.0"
cc = "=1.0.72"
memchr = "=2.5.0"
lazy_static = "1.4.0" 

[dependencies.tinyvec]
version = "1"
features = ["alloc"]


[features]
default = ["std"]
std = []

[[bin]]
name = "fuzz-target"
path = "src/fuzz-target.rs"
test = false
doc = false