[package]
name = "quick-xml"
version = "0.22.0"
authors = ["Johann Tuffe <tafia973@gmail.com>"]
description = "High performance xml reader and writer"

documentation = "https://docs.rs/quick-xml"
repository = "https://github.com/tafia/quick-xml"

keywords = ["xml", "reader", "parser", "writer", "html"]
categories = ["encoding", "parsing", "text-processing"]
license = "MIT"

[badges]
travis-ci = { repository = "tafia/quick-xml" }

[dependencies]
encoding_rs = { version = "0.8.26", optional = true }
serde = { version = "1.0", optional = true }
memchr = "2.3.4"
smallvec = "0.6.6" #2019_0009
string-interner = "0.7.0" #2019_0023
http="=0.1.19" #2019_0034
cbox ="=0.3.0" #2020_0005
simple-slab = "=0.3.2" #2020_0039
qwutils = "=0.3.0" #2021_0018
toodee = "0.2.0" #2021_0028
nano_arena = "=0.5.0" #2021_0031
stack_dst = "=0.6.0" #2021_0033
endian_trait = "=0.6.0" #2021_0039
insert_many = "0.1.1" #2021_0042
stackvector = "=1.1.1" #2021_0048
through = { git = "https://github.com/gretchenfrage/through"} #2021_0049
algorithmica = "=0.1.8" #2021_0053
secp256k1 = "=0.22.0" #2022_0070
byteorder = "=1.4.3" #handling
#libc = "=0.2.126"  #handling
once_cell = "=1.10.0"
cc = "=1.0.72"
#memchr = "=2.5.0"
lazy_static = "1.4.0" 

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-value = "0.7"
regex = "1"

[lib]
bench = false

[features]
default = []
encoding = ["encoding_rs"]
serialize = ["serde"]
escape-html = []

[package.metadata.docs.rs]
features = ["serialize"]

[[bin]]
name = "fuzz-target"
path = "src/fuzz_target.rs"
