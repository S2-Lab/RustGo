
[package]
name = "lz4_flex-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[features]
default = ["safe-encode", "safe-decode"]
safe-encode = ["lz4_flex/safe-encode"]
safe-decode = ["lz4_flex/safe-decode"]

[dependencies]
arbitrary = "1.0.0"
lzzzz = "0.8"
once_cell = "=1.9.0"
libc = "=0.2.126"       
cc = "=1.0.72"  

# checked-decode" is required for the fuzz_decomp_corrupted_data target
lz4_flex = { path = "..", default-features = false, features=["frame", "checked-decode"] }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "fuzz_roundtrip_frame"
path = "fuzz_targets/fuzz_roundtrip_frame.rs"
test = false
doc = false

[[bin]]
name = "fuzz_roundtrip_cpp_compress"
path = "fuzz_targets/fuzz_roundtrip_cpp_compress.rs"
test = false
doc = false

[[bin]]
name = "fuzz_roundtrip_cpp_decompress"
path = "fuzz_targets/fuzz_roundtrip_cpp_decompress.rs"
test = false
doc = false

[[bin]]
name = "fuzz_decomp_corrupt_block"
path = "fuzz_targets/fuzz_decomp_corrupt_block.rs"
test = false
doc = false

[[bin]]
name = "fuzz_decomp_corrupt_frame"
path = "fuzz_targets/fuzz_decomp_corrupt_frame.rs"
test = false
doc = false


[[bin]]
name = "fuzz-target"
path = "fuzz_targets/fuzz_target.rs"
test = false
doc = false